name: Build Android APK & iOS IPA (UniLingua AI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive if present
        run: |
          if [ -f unilingua_ai.zip ]; then
            python3 -c '
          import os, zipfile
          with zipfile.ZipFile("unilingua_ai.zip") as z:
              for info in z.infolist():
                  rel = info.filename.replace("\\", "/")
                  if not rel or rel.endswith("/") or rel.startswith(".github/"):
                      continue
                  os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                  with z.open(info) as src, open(rel, "wb") as dst:
                      dst.write(src.read())
          '
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android & iOS scaffolding
        run: |
          flutter create . \
            --platforms=android,ios \
            --org com.unilingua.ai \
            --project-name unilingua_ai

      - name: Configure Android permissions, Speech Queries & Fixed Release Signing
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="UniLingua AI"/' "$MANIFEST"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "android.speech.RecognitionService" "$MANIFEST"; then
            sed -i 's/<\/queries>/<intent><action android:name="android.speech.RecognitionService"\/><\/intent>\n    <\/queries>/' "$MANIFEST"
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdk(Version)?[[:space:]=]+[a-zA-Z0-9._]+/minSdk 23/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[a-zA-Z0-9._]+/minSdk = 23/g' android/app/build.gradle.kts
          fi

          if [ -f android_signing/unilingua-release.p12 ]; then
            cp android_signing/unilingua-release.p12 android/app/unilingua-release.p12
            ALIAS=$(keytool -list -keystore android/app/unilingua-release.p12 -storetype PKCS12 -storepass unilingua2026 | awk -F, '/PrivateKeyEntry/{print $1; exit}' | xargs)
            echo "Resolved fixed release keystore alias: [$ALIAS]"
            python3 - "$ALIAS" <<'PY'
          import os, sys, re
          alias = sys.argv[1] or "1"
          kts = "android/app/build.gradle.kts"
          if os.path.exists(kts):
              txt = open(kts, "r", encoding="utf-8").read()
              signing_block = f'''
              signingConfigs {{
                  create("release") {{
                      storeFile = file("unilingua-release.p12")
                      storePassword = "unilingua2026"
                      keyAlias = "{alias}"
                      keyPassword = "unilingua2026"
                      storeType = "PKCS12"
                  }}
              }}
          '''
              txt = txt.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
              txt = txt.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              open(kts, "w", encoding="utf-8").write(txt)
          PY
          fi

      - name: Install dependencies & generate custom app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Android Release APK (Fixed Signature & Incrementing Build Number)
        run: |
          BUILD_NUM=$((GITHUB_RUN_NUMBER + 10))
          flutter build apk --release \
            --build-name="1.2.${GITHUB_RUN_NUMBER}" \
            --build-number="${BUILD_NUM}" \
            --dart-define="APP_VERSION=1.2.${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk build/UniLinguaAI.apk

      - name: Upload UniLinguaAI.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniLinguaAI-apk
          path: build/UniLinguaAI.apk
          retention-days: 30

  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive if present
        run: |
          if [ -f unilingua_ai.zip ]; then
            python3 -c '
          import os, zipfile
          with zipfile.ZipFile("unilingua_ai.zip") as z:
              for info in z.infolist():
                  rel = info.filename.replace("\\", "/")
                  if not rel or rel.endswith("/") or rel.startswith(".github/"):
                      continue
                  os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                  with z.open(info) as src, open(rel, "wb") as dst:
                      dst.write(src.read())
          '
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android & iOS scaffolding
        run: |
          flutter create . \
            --platforms=android,ios \
            --org com.unilingua.ai \
            --project-name unilingua_ai

      - name: Configure iOS Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'UniLingua AI'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'UniLingua AI'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Cần quyền Micro để luyện nói và phát âm tiếng Anh cùng AI.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Cần quyền Micro để luyện nói và phát âm tiếng Anh cùng AI.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'Cần quyền nhận diện giọng nói để chấm điểm phát âm tiếng Anh.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Cần quyền nhận diện giọng nói để chấm điểm phát âm tiếng Anh.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Install dependencies, generate custom app icons & set iOS 15.5
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
          flutter build ios --config-only --release --no-codesign || true
          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^#?[[:space:]]*platform :ios, '.*'/platform :ios, '15.5'/" ios/Podfile
            (cd ios && pod install --repo-update)
          fi

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build iOS release app (unsigned)
        run: |
          BUILD_NUM=$((GITHUB_RUN_NUMBER + 10))
          flutter build ios --release --no-codesign \
            --build-name="1.2.${GITHUB_RUN_NUMBER}" \
            --build-number="${BUILD_NUM}" \
            --dart-define="APP_VERSION=1.2.${GITHUB_RUN_NUMBER}"

      - name: Package ESign-compatible Runner.app into UniLinguaAI.ipa
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          APP="build/ipa/Payload/Runner.app"
          xattr -cr "$APP" || true
          find "$APP" -name ".DS_Store" -delete || true
          chmod +x "$APP/Runner"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" "$APP/Info.plist" || true
          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP/Frameworks"/*.framework; do
              if [ -d "$fw" ]; then
                fw_name=$(basename "$fw" .framework)
                [ -f "$fw/$fw_name" ] && chmod +x "$fw/$fw_name"
                [ -f "$fw/Info.plist" ] && /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" "$fw/Info.plist" || true
                rm -rf "$fw/_CodeSignature"
                codesign --force --sign - --timestamp=none "$fw"
              fi
            done
          fi
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - --timestamp=none "$APP"
          cd build/ipa
          zip -r -y -9 UniLinguaAI.ipa Payload -x "*.DS_Store" -x "__MACOSX/*"

      - name: Upload UniLinguaAI.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniLinguaAI-ipa
          path: build/ipa/UniLinguaAI.ipa
          retention-days: 30

  publish-release:
    name: Publish GitHub Release (In-App Auto-Update)
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: UniLinguaAI-apk
          path: release_assets

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: UniLinguaAI-ipa
          path: release_assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release_assets/UniLinguaAI.apk release_assets/UniLinguaAI.ipa \
            --repo "${{ github.repository }}" \
            --title "UniLingua AI $TAG" \
            --notes "Bản cập nhật tự động (Cố định chữ ký số Android cài đè trực tiếp không mất dữ liệu)." \
            --latest
