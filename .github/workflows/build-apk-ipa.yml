name: Build Android APK & iOS IPA (UniLingua AI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive if present
        run: |
          if [ -f unilingua_ai.zip ]; then
            python3 -c '
          import os, zipfile
          with zipfile.ZipFile("unilingua_ai.zip") as z:
              for info in z.infolist():
                  rel = info.filename.replace("\\", "/")
                  if not rel or rel.endswith("/") or rel.startswith(".github/"):
                      continue
                  os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                  with z.open(info) as src, open(rel, "wb") as dst:
                      dst.write(src.read())
          '
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android & iOS scaffolding
        run: |
          flutter create . \
            --platforms=android,ios \
            --org com.unilingua.ai \
            --project-name unilingua_ai

      - name: Configure Android display name, permissions & SDK versions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="UniLingua AI"/' "$MANIFEST"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' "$MANIFEST"
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdk(Version)?[[:space:]=]+[a-zA-Z0-9._]+/minSdk 23/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[a-zA-Z0-9._]+/minSdk = 23/g' android/app/build.gradle.kts
          fi

      - name: Install dependencies & generate custom app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/UniLinguaAI.apk

      - name: Upload UniLinguaAI.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniLinguaAI-apk
          path: build/UniLinguaAI.apk
          retention-days: 30

  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive if present
        run: |
          if [ -f unilingua_ai.zip ]; then
            python3 -c '
          import os, zipfile
          with zipfile.ZipFile("unilingua_ai.zip") as z:
              for info in z.infolist():
                  rel = info.filename.replace("\\", "/")
                  if not rel or rel.endswith("/") or rel.startswith(".github/"):
                      continue
                  os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
                  with z.open(info) as src, open(rel, "wb") as dst:
                      dst.write(src.read())
          '
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android & iOS scaffolding
        run: |
          flutter create . \
            --platforms=android,ios \
            --org com.unilingua.ai \
            --project-name unilingua_ai

      - name: Configure iOS Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'UniLingua AI'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'UniLingua AI'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Cần quyền Micro để luyện nói và phát âm tiếng Anh cùng AI.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Cần quyền Micro để luyện nói và phát âm tiếng Anh cùng AI.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'Cần quyền nhận diện giọng nói để chấm điểm phát âm tiếng Anh.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Cần quyền nhận diện giọng nói để chấm điểm phát âm tiếng Anh.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Install dependencies, generate custom app icons & set iOS 15.5
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
          flutter build ios --config-only --release --no-codesign || true
          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^#?[[:space:]]*platform :ios, '.*'/platform :ios, '15.5'/" ios/Podfile
            (cd ios && pod install --repo-update)
          fi

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build iOS release app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into UniLinguaAI.ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r -9 UniLinguaAI.ipa Payload

      - name: Upload UniLinguaAI.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniLinguaAI-ipa
          path: build/ipa/UniLinguaAI.ipa
          retention-days: 30
